[package]
name = "holi-mcp"
version = "0.2.0"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0"
description = "Holi Local native MCP server for documents and QR batches"
publish = false

[dependencies]
rmcp = { version = "=3.2.0", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "process", "time", "sync", "net", "signal"] }
axum = "0.8"
tower = { version = "0.5", features = ["limit", "util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
subtle = "2"
url = "2"
same-file = "1"
holi-qr = { path = "../../../crates/core/holi-qr", features = ["verify"] }
typst = "=0.15.1"
typst-pdf = "=0.15.1"
typst-layout = "=0.15.1"
flate2 = "1"
tar = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
time = { version = "0.3", features = ["local-offset"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
