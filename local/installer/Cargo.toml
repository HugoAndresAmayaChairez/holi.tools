[package]
name = "holi-local-setup"
version = "0.3.0"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0"
publish = false
description = "Per-user offline installer for Holi Local"

[dependencies]
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
tempfile = "3"
crc32fast = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
