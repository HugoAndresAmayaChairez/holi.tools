[workspace]
resolver = "2"
members = [
  "local/mcp/native",
  "crates/core/holi-p2p",
  "crates/core/holi-qr",
  "crates/wasm/wasm-core",
  "crates/wasm/wasm-crypto",
  "crates/wasm/wasm-p2p",
  "crates/wasm/wasm-qr",
  "crates/wasm/wasm-qr-svg",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Native rendering favors throughput; browser crates retain the small WASM profile.
[profile.native]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 8
