name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs on same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # STAGE 1: Lint & Type Check (Fast feedback)
  # ============================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  # ============================================
  # STAGE 2: Build TypeScript Apps
  # ============================================
  build-apps:
    name: Build Apps
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        app: [main, labs, typst, qr, user, metadata, test]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter holi-${{ matrix.app }} build

  # ============================================
  # STAGE 3: JavaScript Unit Tests
  # ============================================
  test-js:
    name: JS Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # ============================================
  # STAGE 4: Rust/WASM Core (Separate toolchain)
  # ============================================
  build-wasm:
    name: Build Shipping WASM
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('Cargo.lock') }}

      - name: Build QR WASM
        working-directory: crates/wasm/wasm-qr
        run: wasm-pack build --target web --release --out-dir pkg

      - name: Build QR SVG WASM
        working-directory: crates/wasm/wasm-qr-svg
        run: wasm-pack build --target web --release --out-dir pkg

      - name: Build crypto WASM
        working-directory: crates/wasm/wasm-crypto
        run: wasm-pack build --target web --release --out-dir pkg

      - name: Build P2P WASM
        working-directory: crates/wasm/wasm-p2p
        run: wasm-pack build --target web --release --out-dir pkg

  # ============================================
  # STAGE 5: Rust Tests (Unit tests for core)
  # ============================================
  test-rust:
    name: Test Rust Core
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.lock') }}

      - name: Run workspace tests
        run: cargo test --workspace --no-fail-fast
