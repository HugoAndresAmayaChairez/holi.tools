name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs on same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # STAGE 1: Lint & Type Check (Fast feedback)
  # ============================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  # ============================================
  # STAGE 2: Rust/WASM Core (Separate toolchain)
  # The wasm-pack outputs (pkg/) are gitignored, so the app builds and the
  # JS tests download them from this job's artifact instead of rebuilding.
  # ============================================
  build-wasm:
    name: Build Shipping WASM
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('Cargo.lock') }}

      - name: Build QR WASM
        working-directory: crates/wasm/wasm-qr
        run: wasm-pack build --target web --release --out-dir pkg

      - name: Build QR SVG WASM
        working-directory: crates/wasm/wasm-qr-svg
        run: wasm-pack build --target web --release --out-dir pkg

      - name: Build QR Node WASM
        working-directory: crates/wasm/wasm-qr
        run: wasm-pack build --target nodejs --release --out-dir pkg-node

      - name: Build crypto WASM
        working-directory: crates/wasm/wasm-crypto
        run: wasm-pack build --target web --release --out-dir pkg

      - name: Build core WASM
        working-directory: crates/wasm/wasm-core
        run: wasm-pack build --target web --release --out-dir pkg

      - name: Build P2P WASM
        working-directory: crates/wasm/wasm-p2p
        run: wasm-pack build --target web --release --out-dir pkg

      # Multiple paths share crates/wasm as their common root, so the
      # artifact contains wasm-<name>/pkg/... and restores under crates/wasm.
      - name: Upload WASM packages
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          if-no-files-found: error
          retention-days: 1
          path: |
            crates/wasm/wasm-qr/pkg
            crates/wasm/wasm-qr/pkg-node
            crates/wasm/wasm-qr-svg/pkg
            crates/wasm/wasm-crypto/pkg
            crates/wasm/wasm-core/pkg
            crates/wasm/wasm-p2p/pkg

  # ============================================
  # STAGE 3: Build TypeScript Apps
  # ============================================
  build-apps:
    name: Build Apps
    runs-on: ubuntu-latest
    needs: [lint, build-wasm]
    strategy:
      fail-fast: false
      matrix:
        app: [main, labs, typst, qr, user, metadata, image, test]
    steps:
      - uses: actions/checkout@v4

      - name: Download WASM packages
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: crates/wasm

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:engines
      - run: pnpm --filter holi-${{ matrix.app }} build

  # ============================================
  # STAGE 4: JavaScript Unit Tests
  # ============================================
  test-js:
    name: JS Unit Tests
    runs-on: ubuntu-latest
    needs: [lint, build-wasm]
    steps:
      - uses: actions/checkout@v4

      - name: Download WASM packages
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: crates/wasm

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install native Rust toolchain
        uses: dtolnay/rust-toolchain@1.93.0

      - name: Cache native Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-js-native-${{ hashFiles('Cargo.lock') }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  test-local:
    name: Holi Local native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [lint, build-wasm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            binary: holi-mcp
          - os: windows-latest
            binary: holi-mcp.exe
          - os: macos-latest
            binary: holi-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: crates/wasm
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@1.93.0
      - name: Cache native Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-local-native-${{ hashFiles('Cargo.lock') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:engines
      - name: Build native executable
        run: cargo build -p holi-mcp --profile native --locked
      - name: Test native Rust runtime
        run: cargo test -p holi-mcp --profile native --locked
      - name: Test native installer
        if: runner.os != 'macOS'
        run: cargo test -p holi-local-setup --locked
      - name: Exercise native executable through MCP SDK
        run: pnpm --filter @holi/mcp exec vitest run test/native.test.ts
        env:
          HOLI_NATIVE_BINARY: ${{ github.workspace }}/target/native/${{ matrix.binary }}
      - name: Fetch locked dependency sources for license inventory
        # License inventory covers the locked workspace and all target dependencies,
        # including entries not populated by a host-only native build cache.
        run: cargo fetch --locked
      - name: Collect native release archives
        run: node scripts/package-local.mjs
      - name: Build self-contained Windows and Ubuntu installers
        run: node scripts/package-local-installer.mjs
      - name: Verify default and custom installations in isolated homes
        run: node scripts/test-local-installer.mjs
      - name: Upload native platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: holi-local-${{ runner.os }}-${{ runner.arch }}
          path: dist/local/
          if-no-files-found: error
          retention-days: 14

  # ============================================
  # STAGE 5: Rust Tests (Unit tests for core)
  # ============================================
  test-rust:
    name: Test Rust Core
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.lock') }}

      - name: Run workspace tests
        run: cargo test --workspace --no-fail-fast
